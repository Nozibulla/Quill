name: Quill
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.bashar.Quill
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleDisplayName: Quill
    INFOPLIST_KEY_NSHumanReadableCopyright: '© 2026 Quill'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Quill:
    type: application
    platform: macOS
    sources: [Sources, Resources]
  QuillTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Quill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashar.QuillTests
schemes:
  Quill:
    build:
      targets:
        Quill: all
    test:
      targets: [QuillTests]
